services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payment
      MYSQL_USER: payment
      MYSQL_PASSWORD: payment
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.0
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: ["/app/api"]
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "payment:payment@tcp(mysql:3306)/payment?parseTime=true&charset=utf8mb4&loc=UTC"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:-local-development-secret-change-me}"
      CALLBACK_SECRET: "${CALLBACK_SECRET:-local-callback-secret-change-me}"
      WEB_ORIGINS: "${WEB_ORIGINS:-http://localhost:5173,http://localhost:8081,http://localhost:8082}"
      ORDER_SERVICE_URL: "${ORDER_SERVICE_URL:-http://host.docker.internal:8081}"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["/app/worker"]
    environment:
      MYSQL_DSN: "payment:payment@tcp(mysql:3306)/payment?parseTime=true&charset=utf8mb4&loc=UTC"
      REDIS_ADDR: "redis:6379"
      ORDER_SERVICE_URL: "${ORDER_SERVICE_URL:-http://host.docker.internal:8081}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui:v5.20.1
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
      BASE_URL: /docs
    ports:
      - "8082:8080"
    volumes:
      - ./openapi.yaml:/openapi/openapi.yaml:ro
    depends_on:
      api:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
