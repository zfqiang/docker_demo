# 基础网络配置
bind 0.0.0.0 
protected-mode no
port 6379
tcp-keepalive 60
maxclients 10000
daemonize yes
pidfile /var/run/redis_6379.pid
logfile /var/log/redis/redis-slave-1.log  # 第二台改为redis-slave-2.log
dir /data/redis/data

# 内存配置
maxmemory 16gb
maxmemory-policy volatile-lru
activedefrag yes

# 持久化配置
save ""  # 从节点默认关闭自动RDB，避免主节点同步时抢占IO
appendonly yes
appendfsync everysec

# 主从复制配置
replicaof redis-master 6379
replica-read-only yes
replica-priority 100  # 故障转移时优先级低于主节点同机房从节点
masterauth mypass

# 安全加固
requirepass mypass
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command CONFIG ""
