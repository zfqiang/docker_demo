# 绑定所有接口
bind 0.0.0.0
# 关闭保护模式
protected-mode no
# 端口（容器内部端口，宿主机映射不同即可）
port 6379
# 设置访问密码（建议与主节点一致，方便管理）
requirepass "mypass"
# 【关键】主节点密码，用于从节点认证主节点
masterauth "mypass"
# 【关键】指定主节点地址。在 Docker Compose 中，直接使用服务名 'redis-master'
replicaof redis-master 6379
# 从节点只读
replica-read-only yes
# 开启 AOF 持久化
appendonly yes
# 日志级别
loglevel notice