# 基础网络配置
bind 0.0.0.0  
protected-mode no
port 6379
tcp-keepalive 60
maxclients 10000
daemonize no
pidfile /var/run/redis_6380.pid
# logfile /var/log/redis/redis-slave6380.log  

# 内存配置
maxmemory 1gb
maxmemory-policy volatile-lru
activedefrag yes

# 持久化配置
# 从节点默认关闭自动RDB，避免主节点同步时抢占IO
save ""  
appendonly yes
appendfsync everysec

# 主从复制配置
replicaof redis-master 6379
replica-read-only yes
# 故障转移时优先级低于主节点同机房从节点
replica-priority 100  
masterauth mypass

# 安全加固
requirepass mypass
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command CONFIG ""
