# 基础网络配置
bind 0.0.0.0
protected-mode no
port 6379
tcp-keepalive 60
maxclients 10000
daemonize no
pidfile /var/run/redis_6379.pid
# logfile /var/log/redis/redis-master.log

# 内存核心配置
maxmemory 1gb
maxmemory-policy volatile-lru
activedefrag yes

# 持久化配置（金融级混合模式）
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100

# 主从复制优化
repl-backlog-size 1gb
repl-disable-tcp-nodelay no
repl-diskless-sync no

# 脑裂防护关键配置
min-replicas-to-write 1
min-replicas-max-lag 10

# 安全加固
requirepass mypass
masterauth mypass
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
# CONFIG 不能禁用：哨兵故障转移后要向节点发 CONFIG REWRITE 把主从关系写入配置，
# 禁用后 failover 结果无法持久化，节点重启后主从角色会漂移。

