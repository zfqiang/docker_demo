port 26379
# 关键修复：monitor 用的是 Docker 服务名（主机名）。不开 resolve-hostnames，
# 哨兵启动即报 FATAL CONFIG FILE ERROR: Can't resolve master instance hostname，
# 以退出码 1 结束，配合 restart: on-failure 就变成无限重启。
# 注意：必须写在 sentinel monitor 之前（配置按顺序解析）。
sentinel resolve-hostnames yes
# 哨兵广播主从地址时使用主机名（compose 服务名）而不是容器 IP
sentinel announce-hostnames yes
# 监控主节点，quorum设为2（3个哨兵中的多数派）
sentinel monitor mymaster redis-master 6379 2
# 主节点下线时间
sentinel down-after-milliseconds mymaster 5000
# 检测间隔
sentinel failover-timeout mymaster 60000
# 批量同步
sentinel parallel-syncs mymaster 1
# 密码
sentinel auth-pass mymaster mypass
# 关键：哨兵需要知道如何访问其他哨兵和Redis节点
# 在Docker Compose默认网络中，容器名即可解析，通常无需额外announce
