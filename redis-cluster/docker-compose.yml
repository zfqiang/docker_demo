# version: "3.8"

services:
  # 主节点服务
  redis-master:
    image: redis:8.0
    container_name: redis-master
    restart: always
    ports:
      - "6379:6379" # 宿主机端口:容器端口
    volumes:
      - ./master/conf/redis.conf:/usr/local/etc/redis/redis.conf
      - ./master/data:/data
      # - ./master/log:/var/log/redis/  使用docker log 查看日志
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - redis-net

  # 从节点服务
  redis-slave-6378:
    image: redis:8.0
    container_name: redis-slave-6378
    restart: always
    ports:
      - "6378:6379" # 宿主机端口 6378 映射到容器 6379
    volumes:
      - ./slave6378/conf/redis.conf:/usr/local/etc/redis/redis.conf
      - ./slave6378/data:/data
      # - ./slave6378/log:/var/log/redis/
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    depends_on:
      - redis-master
    networks:
      - redis-net

  # 从节点服务
  redis-slave-6380:
    image: redis:8.0
    container_name: redis-slave-6380
    restart: always
    ports:
      - "6380:6379" # 宿主机端口 6380 映射到容器 6379
    volumes:
      - ./slave6380/conf/redis.conf:/usr/local/etc/redis/redis.conf
      - ./slave6380/data:/data
      # - ./slave6378/log:/var/log/redis/
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    depends_on:
      - redis-master
    networks:
      - redis-net

  redis-sentinel-1:
    image: redis:8.0
    container_name: redis-sentinel-1
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-slave-6378
      - redis-slave-6380
    ports:
      - "26379:26379"
    volumes:
      - ./sentinel/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    networks:
      - redis-net

  redis-sentinel-2:
    image: redis:8.0
    container_name: redis-sentinel-2
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-slave-6378
      - redis-slave-6380
    ports:
      - "26380:26379"
    volumes:
      - ./sentinel/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    networks:
      - redis-net

  redis-sentinel-3:
    image: redis:8.0
    container_name: redis-sentinel-3
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-slave-6378
      - redis-slave-6380
    ports:
      - "26381:26379"
    volumes:
      - ./sentinel/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    networks:
      - redis-net

networks:
  redis-net:
    driver: bridge
