x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 主节点服务 线上测试redis-master一定要换成IP地址，不然哨兵可能解释不到主节点。
  redis-master:
    image: redis:8.0
    container_name: redis-master-6379
    restart: "on-failure:5"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "mypass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379" # 宿主机端口:容器端口
    volumes:
      - ./master/conf:/usr/local/etc/redis
      - ./master/data:/data
      # - ./master/log:/var/log/redis/  使用docker log 查看日志
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - redis-net

  # 从节点服务
  redis-slave-6378:
    image: redis:8.0
    container_name: redis-slave-6378
    restart: "on-failure:5"
    logging: *default-logging
    ports:
      - "6378:6379" # 宿主机端口 6378 映射到容器 6379
    volumes:
      - ./slave6378/conf:/usr/local/etc/redis
      - ./slave6378/data:/data
      # - ./slave6378/log:/var/log/redis/
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    depends_on:
      - redis-master
    networks:
      - redis-net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "mypass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 从节点服务
  redis-slave-6380:
    image: redis:8.0
    container_name: redis-slave-6380
    restart: "on-failure:5"
    logging: *default-logging
    ports:
      - "6380:6379" # 宿主机端口 6380 映射到容器 6379
    volumes:
      - ./slave6380/conf:/usr/local/etc/redis
      - ./slave6380/data:/data
      # - ./slave6378/log:/var/log/redis/
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    depends_on:
      redis-master:
        condition: service_healthy # 只有 Master 健康后才启动 Slave
    networks:
      - redis-net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "mypass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-sentinel-1:
    image: redis:8.0
    container_name: redis-sentinel-1
    restart: "on-failure:5"
    logging: *default-logging
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    depends_on:
      redis-master:
        condition: service_healthy # 只有 Master 健康后才启动
      redis-slave-6378:
        condition: service_healthy # 只有 slave-6378 健康后才启动
      redis-slave-6380:
        condition: service_healthy # 只有 slave-6380 健康后才启动
    ports:
      - "26379:26379"
    volumes:
      - ./sentinel/sentinel1:/usr/local/etc/redis
    networks:
      - redis-net

  redis-sentinel-2:
    image: redis:8.0
    container_name: redis-sentinel-2
    restart: "on-failure:5"
    logging: *default-logging
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    depends_on:
      redis-master:
        condition: service_healthy # 只有 Master 健康后才启动
      redis-slave-6378:
        condition: service_healthy # 只有 slave-6378 健康后才启动
      redis-slave-6380:
        condition: service_healthy # 只有 slave-6380 健康后才启动
    ports:
      - "26380:26379"
    volumes:
      - ./sentinel/sentinel2:/usr/local/etc/redis
    networks:
      - redis-net

  redis-sentinel-3:
    image: redis:8.0
    container_name: redis-sentinel-3
    restart: "on-failure:5"
    logging: *default-logging
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    depends_on:
      redis-master:
        condition: service_healthy # 只有 Master 健康后才启动
      redis-slave-6378:
        condition: service_healthy # 只有 slave-6378 健康后才启动
      redis-slave-6380:
        condition: service_healthy # 只有 slave-6380 健康后才启动
    ports:
      - "26381:26379"
    volumes:
      - ./sentinel/sentinel3:/usr/local/etc/redis
    networks:
      - redis-net

networks:
  redis-net:
    driver: bridge
